spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

# OpenAPI properties
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: method
    path: /swagger-ui
  api-docs:
    path: /api-docs

logging:
  level:
    io.micrometer.tracing: DEBUG
    org.springframework.web: DEBUG
    org.springframework.amqp: DEBUG
    com.rabbitmq: DEBUG

app:
  cors:
    mapping: ${APP_CORS_MAPPING:/v1/api/**}
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:https://campaign-controller-dev.apps.stegienko.local,https://campaign-controller-api-gateway-dev.apps.stegienko.local/}"
    allowed-methods: "${APP_CORS_ALLOWED_METHODS:*}"
    allowed-headers: "${APP_CORS_ALLOWED_HEADERS:*}"
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
