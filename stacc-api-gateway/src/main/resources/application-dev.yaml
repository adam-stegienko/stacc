gateway:
  routes:
    campaign-controller-api: http://campaign-controller-api.dev.svc.cluster.local:8081
    google-api: http://google-ads-api.dev.svc.cluster.local:8082

# OpenAPI properties
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: method
    path: /swagger-ui
  api-docs:
    path: /api-docs

logging:
  level:
    io.micrometer.tracing: DEBUG
    org.springframework.web: DEBUG
